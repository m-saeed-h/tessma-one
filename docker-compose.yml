services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tessma
      POSTGRES_PASSWORD: tessma
      POSTGRES_DB: tessma
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessma"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tessma
      MINIO_ROOT_PASSWORD: tessma12345
    ports:
      - "9000:9000"   # S3 API — also what the browser follows presigned URLs to
      - "9001:9001"   # web console (login: tessma / tessma12345)
    volumes:
      - miniodata:/data

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://tessma:tessma@db:5432/tessma?schema=public"
      APP_DATABASE_URL: "postgresql://tessma_app:tessma_app@db:5432/tessma?schema=public"
      # Internal (compose network) vs. public (host-published) — see
      # S3Service's class comment for why both exist.
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"
      S3_ACCESS_KEY: "tessma"
      S3_SECRET_KEY: "tessma12345"
      S3_BUCKET: "tessma-documents"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "4000:4000"
    # Real migration history (prisma/migrations), not schema-diffing — Charter
    # rule 17 ("one database migration timeline"). `migrate deploy` is the
    # non-interactive, CI/prod-safe form; `prisma migrate dev` refuses to run
    # in a non-interactive container.
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && npm run seed && npx prisma db execute --file prisma/rls.sql --schema prisma/schema.prisma && npm run start:prod"

  web:
    build: ./apps/web
    environment:
      # Read by the BROWSER — must be reachable from the host, so it's the
      # published port, not the compose service name.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Read by the Next.js SERVER (layout.tsx's branding resolution) — must
      # be reachable from inside the web container, so it's the compose
      # service name. Deliberately NOT prefixed NEXT_PUBLIC_, so Next reads it
      # fresh at request time rather than inlining it into the client bundle
      # at build time (when the compose network doesn't exist yet).
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  dbdata:
  miniodata:
